[alembic]
script_location = alembic
prepend_sys_path = .
# NOTE: database URL is intentionally NOT set here.
# alembic/env.py reads it from app.config.Settings so that credentials
# never enter version control (NFR-004).
# This file must stay ASCII-only: alembic reads it with encoding="locale",
# which is GBK on this Windows host and fails on UTF-8 CJK characters.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
