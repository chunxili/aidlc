server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 内容指纹化的静态资源（文件名含 hash），改一次内容 hash 就变，可长期强缓存。
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由：任何未命中静态文件的路径都回落到 index.html，
    # 否则刷新 /my-coupons 这类前端路由会 404。
    #
    # index.html 绝不能被缓存：它引用带 hash 的 bundle 文件名。若被浏览器缓存，
    # 即使重新构建上线，浏览器仍按旧 index.html 加载旧 bundle，导致前端不更新
    # （曾表现为"我的优惠券"改了 bug 却仍不显示）。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 同源代理 /api 到后端容器，避免浏览器跨域
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
